<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Enterprise Petty Cash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0b3f7a;
    --blue:    #1e5fa8;
    --blue-lt: #2f80d2;
    --teal:    #00b3a4;
    --teal-lt: #5fdccb;
    --ink:     #123047;
    --muted:   #5d7c93;
    --line:    #c9dae6;
    --panel:   #ffffff;
    --page:    #dfeaf2;
    --tile:    #f2f8fb;
    --bg-main: var(--page);
    --bg-surface: var(--panel);
    --bg-card: var(--tile);
    --border-color: var(--line);
    --border-focus: var(--blue-lt);
    --primary: var(--blue);
    --primary-hover: var(--navy);
    --debit: #c0392b;
    --debit-bg: #fdefed;
    --text-primary: var(--ink);
    --text-secondary: var(--muted);
    --text-muted: #7d98ab;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow: 0 1px 3px rgba(11, 63, 122, .14), 0 6px 16px rgba(11, 63, 122, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    background-color: var(--page);
    background-image: radial-gradient(circle at 50% 0%, #eef5fa 0%, var(--page) 55%);
    color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .login-card {
    width: min(400px, 100%); background: var(--panel);
    border: 1px solid var(--line); border-top: 3px solid var(--blue);
    border-radius: var(--radius-lg);
    padding: 32px 26px; text-align: center;
    box-shadow: 0 1px 3px rgba(11,63,122,.14), 0 14px 34px rgba(11,63,122,.16);
    animation: rise .35s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .brand-logo { width: 190px; max-width: 68%; height: auto; display: block; margin: 2px auto 16px; }
  .login-card h2 { color: var(--navy); font-weight: 800; letter-spacing: .2px; }
  .form-group { margin-bottom: 12px; text-align: left; }
  .form-group label { display: block; font-size: 9.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; font-weight: 800; letter-spacing: .5px; }
  .form-ctrl {
    width: 100%; background: #fff; border: 1px solid var(--line);
    color: var(--ink); padding: 8px 11px; border-radius: var(--radius-sm); font-size: 12px; font-family: inherit; font-weight: 600;
  }
  .form-ctrl:focus { border-color: var(--blue-lt); outline: none; box-shadow: 0 0 0 2px rgba(47,128,210,.16); }
  .form-ctrl::placeholder { color: #9ab0bf; font-weight: 500; }
  .pwd-wrap { position: relative; }
  .pwd-wrap .form-ctrl { padding-right: 46px; }
  .pwd-toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--blue); cursor: pointer; font-size: 10.5px;
    font-weight: 800; text-transform: uppercase; letter-spacing: .4px; padding: 4px 6px; border-radius: 4px;
  }
  .pwd-toggle:hover { color: var(--navy); background: #eef7fb; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    background: linear-gradient(180deg, var(--blue-lt), var(--blue)); color: #fff;
    border: 1px solid var(--blue); padding: 10px; border-radius: var(--radius-sm); font-weight: 700; font-size: 12.5px; letter-spacing: .3px;
    cursor: pointer; margin-top: 8px; box-shadow: var(--shadow); transition: filter .15s ease, background .15s ease, opacity .15s ease;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff;
    animation: spin .7s linear infinite; display: none;
  }
  .btn.loading .spinner { display: inline-block; }
  .btn.loading .btn-label { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-banner {
    display: none; align-items: center; gap: 8px; text-align: left; background: #fdefed; border: 1px solid #f0c9c3; color: #a5301f;
    padding: 8px 12px; border-radius: var(--radius-sm); font-size: 11.5px; font-weight: 600; margin-bottom: 12px;
  }
  .error-banner.show { display: flex; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700;
    color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: .5px;
    padding: 4px 10px; border-radius: 20px; border: 1px solid var(--line); background: var(--tile);
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-pill.online { color: #0a7d4f; border-color: #bfe6d3; background: #eafbf3; }
  .status-pill.online .status-dot { background: #0a7d4f; }
  .scope-note { font-size: 11px; color: var(--ink); text-align: left; line-height: 1.5; font-weight: 500;
    background: #eef7fb; border: 1px solid #bfdcec; border-left: 3px solid var(--teal); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 12px; }
  footer { margin-top: 16px; font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .2px; }
</style>
</head>
<body>

<div class="login-card">
  <img class="brand-logo" src="logo.png" alt="ProstarM - Power Redefined">
  <h2 style="font-size: 20px; margin-bottom: 6px;">Petty Cash Portal</h2>
  <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 16px;">Enter your credentials to continue</p>

  <span class="status-pill online" id="authModePill">
    <span class="status-dot"></span>
    <span id="authModeLabel">Connecting to server...</span>
  </span>

  <div class="error-banner" id="loginError"><span>⚠</span><span id="loginErrorText">Invalid credentials.</span></div>

  <form id="loginForm" autocomplete="off">
    <div class="scope-note" id="autoScopeNote">
      Your role, branch and reporting line are read automatically from the employee
      master &mdash; no need to pick an access level.
    </div>
    <div class="form-group">
      <label for="loginUsername" id="lblUsername">Username</label>
      <input type="text" class="form-ctrl" id="loginUsername" placeholder="Username" style="margin-bottom:10px;" autocomplete="username">
      <label for="loginPassword">Access Key / Password</label>
      <div class="pwd-wrap">
        <input type="password" class="form-ctrl" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
        <button type="button" class="pwd-toggle" onclick="togglePwd()" id="pwdToggleBtn" aria-label="Show password">Show</button>
      </div>
    </div>

    <button class="btn" type="submit" id="loginBtn">
      <span class="spinner"></span>
      <span class="btn-label">Sign In</span>
    </button>
  </form>

  <footer>Enterprise Petty Cash Ledger · Session auto-expires after 8 hours</footer>
</div>

<script src="rbac.js"></script>
<script>
  // Primary Power Automate Endpoints
  const AUTH_ENDPOINT = "https://8549b42c711be8948675eefb5cf215.dd.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/eb3f3e2aa2994a83bf2753725fd30d61/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=VuZB3qWaEMiR8eFeU9k9SztSHoK981HOHlHMZikK4Nw";
  const EXCEL_GET_CONFIG_URL = "https://8549b42c711be8948675eefb5cf215.dd.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/17/workflows/3d8c890bdd85458eb4af7f65b3a49577/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=jBQBA8EMi2xs9QMwg9Cpcb1f2GtFGrCxDJPXRwIvHUw";
  const API_KEY = ""; 

  let DYNAMIC_BRANCHES = [];
  const $ = (id) => document.getElementById(id);

  // Employee master lookup, keyed by EmpCode (uppercased). Built once from the
  // same Excel config the rest of the suite reads, so role/branch/hierarchy
  // are always sourced from one place.
  let EMP_CONFIG = {};

  function normalizeBranchCode(b) {
    if (!b) return b;
    b = String(b);
    if (b.includes('-')) {
      const p = b.split('-');
      return p[0].trim() + '_' + p[1].trim();
    }
    return b;
  }

  // A row's key is matched case-insensitively against any of these header names.
  function rowVal(row, key) {
    const foundKey = Object.keys(row).find(k => k.toLowerCase() === key.toLowerCase());
    return foundKey ? row[foundKey] : undefined;
  }

  // IsHOAdmin / IsAdmin (either column) -> admin. Otherwise Role / Access Level
  // text decides: contains "audit" -> auditor, "regional" -> regional, else branch.
  function deriveRole(row) {
    const isAdmin = String(rowVal(row, 'IsHOAdmin') || '').toUpperCase() === 'TRUE'
                  || String(rowVal(row, 'IsAdmin') || '').toUpperCase() === 'TRUE';
    if (isAdmin) return 'admin';
    const raw = String(rowVal(row, 'Role') || rowVal(row, 'Access Level') || '').toLowerCase();
    if (raw.includes('admin')) return 'admin';
    if (raw.includes('audit')) return 'auditor';
    if (raw.includes('regional')) return 'regional';
    return 'branch';
  }

  // Load the employee master + branch list dynamically from Excel on startup.
  async function loadConfig() {
    try {
      ProstarmRBAC.configure(EXCEL_GET_CONFIG_URL);
      await ProstarmRBAC.loadDirectory();
      const res = await fetch(EXCEL_GET_CONFIG_URL);
      const data = await res.json();
      const rows = data.value ? data.value : data;
      const branchSet = new Set();

      rows.forEach(r => {
        let b = normalizeBranchCode(rowVal(r, 'Branch') || rowVal(r, 'BranchCode'));
        if (b && !branchSet.has(b)) {
          branchSet.add(b);
          const bName = rowVal(r, 'BranchName') || b.split('_')[1] || b;
          DYNAMIC_BRANCHES.push({ code: b, name: bName });
        }

        const code = rowVal(r, 'EmpCode');
        if (code) {
          EMP_CONFIG[String(code).trim().toUpperCase()] = {
            n: rowVal(r, 'FullName'),
            b: b,
            email: rowVal(r, 'Email') || rowVal(r, 'EmailAddress') || rowVal(r, 'Email ID') || '',
            regionalManagerCode: rowVal(r, 'RegionalManagerCode') || null,
            role: deriveRole(r)
          };
        }
      });

      if (DYNAMIC_BRANCHES.length === 0) throw new Error("No branches found in config.");
      if (Object.keys(EMP_CONFIG).length === 0) throw new Error("No employees found in config.");

      $('authModeLabel').textContent = "Server authentication active";
    } catch (err) {
      console.error("Failed to load employee master dynamically", err);
      $('authModeLabel').textContent = "Error connecting to server";
      $('authModePill').className = "status-pill error";
      showLoginError("Could not load the employee master from the server. Please try again shortly.");
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadConfig();
  });

  function togglePwd() {
    const input = $('loginPassword');
    const btn = $('pwdToggleBtn');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? 'Show' : 'Hide';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  }

  function showLoginError(msg) {
    $('loginErrorText').textContent = msg;
    $('loginError').classList.add('show');
  }
  function hideLoginError() { $('loginError').classList.remove('show'); }

  function setLoginLoading(isLoading) {
    $('loginBtn').classList.toggle('loading', isLoading);
    $('loginBtn').disabled = isLoading;
  }

  async function fetchWithTimeout(url, options, timeoutMs) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs || 12000);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(id);
    }
  }

  function startSession(activeUser) {
    activeUser.loginAt = Date.now();
    sessionStorage.setItem('activeUser', JSON.stringify(activeUser));
    window.location.href = 'dashboard.html';
  }

  // Determine every branch this EmpCode has visibility over, per their derived role.
  function resolveBranchesForUser(empCode, role, ownBranch) {
    if (role === 'admin' || role === 'auditor') {
      return DYNAMIC_BRANCHES.length > 0 ? DYNAMIC_BRANCHES.map(b => b.code) : ["ALL"];
    }
    if (role === 'regional') {
      const covered = Object.values(EMP_CONFIG)
        .filter(r => String(r.regionalManagerCode || '').trim().toUpperCase() === empCode)
        .map(r => r.b)
        .filter(Boolean);
      const unique = Array.from(new Set(covered));
      if (unique.length) return unique;
      // No branches list this person as their RM yet — fall back to their own branch.
      return ownBranch ? [ownBranch] : [];
    }
    return ownBranch ? [ownBranch] : [];
  }

  // Find this person's row in the Excel master. The login username won't always
  // equal EmpCode (e.g. AD usernames like "chandans" vs EmpCode "E004"), so try
  // several identity fields the auth backend might hand back before giving up.
  function findEmployeeRow(uname, data) {
    const candidates = [uname, data && data.username, data && data.empCode, data && data.EmpCode]
      .filter(Boolean).map(c => String(c).trim().toUpperCase());
    for (const c of candidates) {
      if (EMP_CONFIG[c]) return { key: c, row: EMP_CONFIG[c] };
    }
    const emailToMatch = (data && data.email) || '';
    if (emailToMatch) {
      const hitKey = Object.keys(EMP_CONFIG).find(k =>
        EMP_CONFIG[k].email && String(EMP_CONFIG[k].email).toLowerCase() === emailToMatch.toLowerCase());
      if (hitKey) return { key: hitKey, row: EMP_CONFIG[hitKey] };
    }
    return null;
  }

  // Authenticate against the backend first (password check), then prefer the
  // Excel employee master for role/branch/name/email. If this person's login
  // username doesn't match anything in Excel, fall back to whatever the
  // backend itself returned rather than blocking their sign-in.
  async function handleServerLogin(username, pwd) {
    const uname = username.trim();

    const res = await fetchWithTimeout(AUTH_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(API_KEY ? { 'X-API-Key': API_KEY } : {}) },
      body: JSON.stringify({ username: uname, password: pwd })
    }, 12000);

    if (!res.ok) {
      if (res.status === 401 || res.status === 403) throw new Error('Invalid username or password.');
      throw new Error(`Login service error (HTTP ${res.status}).`);
    }
    const data = await res.json();
    if (!data || data.success !== true) {
      throw new Error(data && data.message ? data.message : 'Invalid credentials.');
    }

    // Authentication verifies the password; all authorization attributes come
    // from rbac.js/the employee directory, never from this response or UI.
    return ProstarmRBAC.createSession(data, uname);

    const match = findEmployeeRow(uname, data);

    let role, branches;
    if (match) {
      role = match.row.role || 'branch';
      branches = resolveBranchesForUser(match.key, role, match.row.b);
    } else {
      console.warn('No Excel master row matched "' + uname + '" — using role/branch from the auth server instead.');
      role = data.role || 'branch';
      branches = data.branches && data.branches.length ? data.branches : (data.branch ? [data.branch] : []);
      if (role === 'admin' || role === 'auditor') {
        branches = DYNAMIC_BRANCHES.length > 0 ? DYNAMIC_BRANCHES.map(b => b.code) : ["ALL"];
      }
    }

    return {
      role: role,
      branch: branches[0] || 'ALL',
      branches: branches,
      username: uname,
      name: (match && match.row.n) || data.name || data.displayName || uname,
      email: (match && match.row.email) || data.email || '',
      token: data.token || ''
    };
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideLoginError();

    const username = $('loginUsername').value.trim();
    const pwd = $('loginPassword').value.trim();

    if (!username) { showLoginError('Please enter your username.'); return; }
    if (!pwd) { showLoginError('Please enter your password.'); return; }

    setLoginLoading(true);
    try {
      const activeUser = await handleServerLogin(username, pwd);
      startSession(activeUser);
    } catch (err) {
      showLoginError(err.name === 'AbortError' ? 'Login request timed out. Check your connection and try again.' : (err.message || 'Login failed.'));
      setLoginLoading(false);
    }
  });

  // Auto-logout stale sessions (>8h) before showing the form
  (function clearStaleSession() {
    try {
      const s = JSON.parse(sessionStorage.getItem('activeUser') || 'null');
      if (s && s.loginAt && Date.now() - s.loginAt > 8 * 60 * 60 * 1000) {
        sessionStorage.removeItem('activeUser');
      } else if (s) {
        window.location.href = 'dashboard.html';
      }
    } catch (e) { /* ignore malformed session */ }
  })();

</script>
</body>
</html>
